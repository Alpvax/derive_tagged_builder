[package]
name = "derive_tagged_builder_macro"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
darling = "0.20.10"
ecow = "0.2.5"
proc-macro-error = "1.0.4"
proc-macro2 = "1.0.37"
quote = "1.0.35"
runtime-format = "0.1.3"
self_cell = "1.2.0"
syn = { version = "2.0.15", features = ["full", "extra-traits"] }

[dev-dependencies]
expect-test = "1.5.1"
prettyplease = "0.2.32"
